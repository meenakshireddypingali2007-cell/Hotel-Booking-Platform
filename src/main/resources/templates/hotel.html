<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${hotel.name} + ' | StayHaven'">Hotel</title><link rel="stylesheet" href="/css/site.css"></head><body><div th:replace="~{fragments/nav}"></div><main class="detail"><a class="back" href="/">â† All stays</a><div class="detail-image"><img th:src="${hotel.imageUrl}" th:alt="${hotel.name}" onerror="this.onerror=null;this.src='/images/stay-placeholder.svg'"></div><div class="detail-head"><div><p class="eyebrow" th:text="${hotel.location}">Location</p><h1 th:text="${hotel.name}">Hotel</h1></div><span class="rating large">â˜… <span th:text="${hotel.rating}">4.8</span></span></div><p class="detail-copy" th:text="${hotel.description}"></p><p class="muted" th:if="${hotel.address != null}" th:text="${hotel.address}"></p><div class="section-heading"><div><p class="eyebrow">STAY YOUR WAY</p><h2>Rooms & suites</h2></div></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div th:if="${availabilityError}" class="alert error" th:text="${availabilityError}"></div><article class="room" th:each="room : ${rooms}"><div><p class="eyebrow">ROOM TYPE</p><h3 th:text="${room.type}">Room</h3><p class="muted" th:text="${room.description}"></p><span th:text="'Up to ' + ${room.capacity} + ' guests Â· availability shown after selecting dates'"></span><p class="availability" th:if="${availability != null}" th:text="${availability[room.id] > 0 ? availability[room.id] + ' rooms available for these dates' : 'Fully booked for these dates'}"></p></div><div class="room-book"><strong th:text="'â‚¹' + ${#numbers.formatDecimal(room.pricePerNight,1,0)}"></strong><small>per night</small><form sec:authorize="isAuthenticated()" th:action="@{/bookings/new}" method="post"><input type="hidden" name="hotelId" th:value="${hotel.id}"><input type="hidden" name="roomId" th:value="${room.id}"><label>Check in<input type="date" name="checkIn" th:value="${checkIn}" required></label><label>Check out<input type="date" name="checkOut" th:value="${checkOut}" required></label><label>Guests<select name="guests"><option th:each="g : ${#numbers.sequence(1,room.capacity)}" th:value="${g}" th:text="${g}" th:selected="${g == guests}"></option></select></label><label>Your name<input name="guestName" placeholder="Full name" required></label><label>Guest email<input name="guestEmail" type="email" th:value="${#authentication.name}" required></label><label>Offer code (optional)<input name="offerCode" maxlength="32" placeholder="Enter offer code"></label><label>Loyalty points to redeem (balance: <span th:text="${loyaltyBalance}"></span>)<input type="number" name="loyaltyPoints" min="0" step="100" value="0"></label><button class="button full">Reserve this room</button><small>Demo checkout Â· no card details collected</small></form><div sec:authorize="isAnonymous()"><a class="button" href="/login">Sign in to book</a></div></div></article><section class="section reviews"><p class="eyebrow">GUEST VOICES</p><h2>Reviews</h2><article class="review-card" th:each="r:${hotelReviews}"><strong th:text="${r.rating} + ' / 5'"></strong><b th:text="${r.guest.name}"></b><span th:text="${r.comment}"></span><small th:text="${r.createdAt}"></small></article><p class="muted" th:if="${#lists.isEmpty(hotelReviews)}">Reviews are shared by guests after a completed stay.</p></section></main><footer>Â© 2026 StayHaven <span>Go somewhere. Feel at home.</span></footer></body></html>
