<script>
(()=>{const indicator=document.getElementById('admin-page-loading');if(!indicator)return;const show=()=>{indicator.hidden=false};document.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link||event.defaultPrevented||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||link.target==='_blank')return;const url=new URL(link.href,window.location.href);if(url.origin===window.location.origin&&url.pathname.startsWith('/admin'))show()});document.addEventListener('submit',event=>{if(event.target.closest('.admin-body'))show()})})();
</script>
