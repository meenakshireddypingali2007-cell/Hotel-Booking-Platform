<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body><div th:replace="~{fragments/nav}"></div><main class="auth-wrap"><section class="auth-art"><p class="eyebrow">A BETTER WAY TO GET AWAY</p><h1>Make room<br>for <em>somewhere.</em></h1><p>Join a community that likes their stays personal and their plans flexible.</p></section><form class="auth-card" th:action="@{/register}" th:object="${form}" method="post"><p class="eyebrow">GET STARTED</p><h2>Create your account</h2><label>Full name<input th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></label><label>Email<input type="email" th:field="*{email}" required><small class="field-error" th:errors="*{email}"></small></label><label>Address (optional)<input th:field="*{address}" maxlength="240"></label><label>Phone<input th:field="*{phone}" required><small class="field-error" th:errors="*{phone}"></small></label><label>Password<input type="password" th:field="*{password}" minlength="8" required><small>At least 8 characters</small><small class="field-error" th:errors="*{password}"></small></label><button class="button full">Create account <span>↗</span></button><p class="muted center">Already a member? <a href="/login">Sign in</a></p></form></main></body></html>
