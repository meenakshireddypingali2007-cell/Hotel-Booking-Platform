<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your profile | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body><div th:replace="~{fragments/nav}"></div><main class="section page narrow"><p class="eyebrow">YOUR ACCOUNT</p><h1>A little about <em>you.</em></h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><form class="auth-card form-card" th:action="@{/profile}" method="post"><label>Full name<input name="name" th:value="${account.name}" required></label><label>Email address<input type="email" th:value="${account.email}" disabled><small>Email address cannot be changed here.</small></label><label>Phone<input name="phone" th:value="${account.phone}" required></label><label>Address (optional)<input name="address" maxlength="240" th:value="${account.address}"></label><button class="button">Save changes</button></form></main></body></html>
