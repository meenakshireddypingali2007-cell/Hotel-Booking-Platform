<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Booking details | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body><div th:replace="~{fragments/nav}"></div><main class="confirm"><div class="confirm-mark">✓</div><p class="eyebrow">BOOKING DETAILS</p><h1>Your stay<br><em>is reserved.</em></h1><p>Your confirmation details are below. Payment status is shown explicitly.</p><article class="confirm-card"><div><span>BOOKING REFERENCE</span><strong th:text="${booking.reference}"></strong></div><hr><h3 th:text="${booking.room.hotel.name}"></h3><p th:text="${booking.room.type} + ' · ' + ${booking.guests} + ' guests'"></p><p th:text="${#temporals.format(booking.checkIn,'dd MMM yyyy')} + ' → ' + ${#temporals.format(booking.checkOut,'dd MMM yyyy')}"></p><div class="confirm-total"><span th:text="${booking.nights} + ' nights · ' + ${booking.paymentStatus}"></span><strong th:text="'₹' + ${#numbers.formatDecimal(booking.totalPrice,1,0)}"></strong></div></article><form th:if="${booking.paymentStatus != 'DEMO PAID' and booking.status == 'CONFIRMED'}" th:action="@{/bookings/{id}/demo-payment(id=${booking.id})}" method="post"><p class="alert">Demo/test mode only. This records a test payment and will not charge a card.</p><button class="button">Record demo payment</button></form><a class="button" href="/dashboard">View my trips →</a></main></body></html>
