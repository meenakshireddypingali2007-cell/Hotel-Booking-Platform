<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room details | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><a href="/admin/rooms">← Rooms</a><header class="admin-head"><div><p class="eyebrow" th:text="${unit.room.hotel.name}"></p><h1 th:text="'Room ' + ${unit.roomNumber}"></h1><p th:text="${unit.room.type} + ' · floor ' + ${unit.floor} + ' · ' + ${unit.bedType}"></p></div><span class="status-pill" th:classappend="${unit.status.toLowerCase()}" th:text="${unit.status}"></span></header><h2>Booking history</h2><div class="table-wrap"><table><thead><tr><th>Guest</th><th>Reference</th><th>Scheduled stay</th><th>Actual check-in</th><th>Actual check-out</th><th>Status</th><th>Details</th></tr></thead><tbody><tr th:each="b:${history}"><td th:text="${b.guestName}"></td><td th:text="${b.reference}"></td><td th:text="${b.checkIn} + ' ' + ${b.checkInTime} + ' → ' + ${b.checkOut} + ' ' + ${b.checkOutTime}"></td><td th:text="${b.checkedInAt}"></td><td th:text="${b.checkedOutAt}"></td><td th:text="${b.status}"></td><td><a th:href="@{/admin/bookings/{id}(id=${b.id})}">View booking</a></td></tr></tbody></table></div><h2>Status history</h2><div class="table-wrap"><table><thead><tr><th>When</th><th>From</th><th>To</th><th>Staff</th><th>Note</th></tr></thead><tbody><tr th:each="h:${statusHistory}"><td th:text="${h.changedAt}"></td><td th:text="${h.oldStatus}"></td><td th:text="${h.newStatus}"></td><td th:text="${h.changedBy != null ? h.changedBy.name : 'System'}"></td><td th:text="${h.note}"></td></tr></tbody></table></div></main></body></html>
