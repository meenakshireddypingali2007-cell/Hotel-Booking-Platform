<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offers | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">PROMOTIONS</p><h1>Special offers</h1><p>Active codes apply to eligible room bookings at checkout. Fixed discounts cannot exceed the booking amount.</p><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><section class="admin-section"><h2>Create offer</h2><form class="filter-bar" action="/admin/offers" method="post"><input name="name" placeholder="Offer name" required><input name="code" placeholder="CODE" required><select name="discountType"><option value="PERCENT">Percent</option><option value="FIXED">Fixed amount</option></select><input type="number" name="discountValue" min="0.01" step="0.01" placeholder="Discount value" required><input type="date" name="startsOn" required><input type="date" name="endsOn" required><select name="applicableRoomType"><option value="">All room types</option><option th:each="r:${roomTypes}" th:value="${r.type}" th:text="${r.type}"></option></select><button class="small-button">Create offer</button></form></section><article class="unit-card" th:each="o:${offers}"><h2 th:text="${o.name} + ' · ' + ${o.code}"></h2><p th:text="${o.discountValue} + ' ' + ${o.discountType} + ' · ' + ${o.startsOn} + ' to ' + ${o.endsOn}"></p><p th:text="${o.applicableRoomType != null ? o.applicableRoomType : 'All room types'}"></p><span class="status-pill" th:text="${o.active ? 'ACTIVE' : 'INACTIVE'}"></span><details><summary>Edit offer</summary><form class="filter-bar" th:action="@{/admin/offers/{id}/edit(id=${o.id})}" method="post"><input name="name" th:value="${o.name}" required><input type="number" name="discountValue" min="0.01" step="0.01" th:value="${o.discountValue}" required><input type="date" name="startsOn" th:value="${o.startsOn}" required><input type="date" name="endsOn" th:value="${o.endsOn}" required><input name="applicableRoomType" th:value="${o.applicableRoomType}" placeholder="Room type or blank for all"><button class="small-button">Save</button></form></details><form th:action="@{/admin/offers/{id}/toggle(id=${o.id})}" method="post"><button class="small-button" th:text="${o.active ? 'Deactivate' : 'Activate'}"></button></form></article></main></body></html>
