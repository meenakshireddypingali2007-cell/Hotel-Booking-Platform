<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooms | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><header class="admin-head"><div><p class="eyebrow">PROPERTY OPERATIONS</p><h1>Rooms</h1><p>Room status, assignments and housekeeping readiness.</p></div><form class="filter-bar" action="/admin/rooms"><input name="q" placeholder="Room, type or hotel" th:value="${q}"><button class="small-button">Search</button></form></header><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="room-grid"><article class="unit-card" th:each="u : ${units}"><div class="unit-top"><strong th:text="${u.roomNumber}"></strong><span class="status-pill" th:classappend="${displayStatus[u.id].toLowerCase()}" th:text="${displayStatus[u.id]}"></span></div><h3 th:text="${u.room.type}"></h3><p th:text="${u.room.hotel.name} + ' · Floor ' + ${u.floor} + ' · ' + ${u.bedType} + ' bed · sleeps ' + ${u.room.capacity}"></p><b th:text="'₹' + ${u.room.pricePerNight} + ' / night'"></b><div th:if="${current[u.id] != null}" class="unit-booking"><strong th:text="${current[u.id].guestName}"></strong><span th:text="|Scheduled ${current[u.id].checkIn} ${current[u.id].checkInTime} → ${current[u.id].checkOut} ${current[u.id].checkOutTime}|"></span><small th:if="${current[u.id].checkedInAt != null}" th:text="'Actual check-in ' + ${current[u.id].checkedInAt}"></small><small th:text="'Ref ' + ${current[u.id].reference}"></small></div><div class="unit-actions"><a class="small-button" th:href="@{/admin/rooms/{id}(id=${u.id})}">View Details</a><form th:action="@{/admin/rooms/{id}/status(id=${u.id})}" method="post"><select name="status"><option value="AVAILABLE">Mark Available</option><option value="CLEANING">Cleaning</option><option value="MAINTENANCE">Maintenance</option></select><button class="small-button">Update</button></form></div></article></div></main></body></html>
