<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">GUEST FEEDBACK</p><h1>Reviews</h1><p>Average guest rating: <b th:text="${#numbers.formatDecimal(averageRating,1,1)}"></b> / 5</p><div class="table-wrap"><table><thead><tr><th>Guest</th><th>Hotel</th><th>Rating</th><th>Comment</th><th>Date</th></tr></thead><tbody><tr th:each="r:${reviews}"><td th:text="${r.guest.name}"></td><td th:text="${r.booking.room.hotel.name}"></td><td th:text="${r.rating} + ' / 5'"></td><td th:text="${r.comment}"></td><td th:text="${r.createdAt}"></td></tr></tbody></table></div></main></body></html>
