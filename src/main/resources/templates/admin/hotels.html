<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage stays | StayHaven Admin</title><link rel="stylesheet" href="/css/site.css"></head>
<body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><div class="admin-topbar"><div th:replace="~{fragments/nav}"></div></div>
<main class="section page"><a class="back" href="/admin">← Admin overview</a><p class="eyebrow">THE STAY COLLECTION</p><h1>Manage <em>stays.</em></h1>
<form class="filter-bar" method="get" action="/admin/hotels"><input name="q" placeholder="Search hotel, city, state or address" th:value="${q}"><button class="small-button">Search</button><a href="/admin/hotels">Clear</a></form>
<div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<form class="admin-add" th:action="@{/admin/hotels}" method="post"><h2>Add a hotel</h2><div class="form-grid">
<label>Hotel name<input name="name" required maxlength="120"></label><label>City, state and country<input name="location" required maxlength="100" placeholder="Kochi, Kerala, India"></label><label>Street address<input name="address" maxlength="240"></label>
<label>Rating (0-5)<input type="number" name="rating" min="0" max="5" step="0.1" value="4.5" required></label><label>Image URL<input name="imageUrl" placeholder="https://..."></label><label class="wide">Description<textarea name="description" required></textarea></label></div><button class="button">Add hotel</button></form>
<h2 class="subheading">Hotels & room inventory</h2><p class="muted" th:if="${#lists.isEmpty(hotels)}">No hotels match this search. Clear the filter or add a hotel.</p>
<article class="admin-hotel" th:each="h : ${hotels}"><div class="admin-hotel-head"><div><p class="eyebrow" th:text="${h.location}"></p><h3 th:text="${h.name}"></h3><p class="muted" th:if="${h.address != null}" th:text="${h.address}"></p><p class="muted" th:text="${h.description}"></p><img th:if="${h.imageUrl != null}" th:src="${h.imageUrl}" th:alt="${h.name}" style="width:110px;height:70px;object-fit:cover" onerror="this.style.display='none'"></div><form th:action="@{/admin/hotels/{id}/delete(id=${h.id})}" method="post"><button class="text-button danger" onclick="return confirm('Delete this hotel and its rooms?')">Delete hotel</button></form></div>
<details><summary>Edit hotel details</summary><form class="form-grid admin-edit" th:action="@{/admin/hotels/{id}/edit(id=${h.id})}" method="post"><label>Name<input name="name" th:value="${h.name}" required></label><label>City, state and country<input name="location" th:value="${h.location}" required></label><label>Street address<input name="address" th:value="${h.address}"></label><label>Rating<input type="number" name="rating" min="0" max="5" step="0.1" th:value="${h.rating}" required></label><label>Image URL<input name="imageUrl" th:value="${h.imageUrl}"></label><label class="wide">Description<textarea name="description" required th:text="${h.description}"></textarea></label><button class="small-button">Save hotel</button></form></details>
<div class="room-admin" th:each="r : ${h.rooms}"><b th:text="${r.type}"></b><span th:text="'₹' + ${r.pricePerNight} + '/night · capacity ' + ${r.capacity} + ' · ' + ${r.quantity} + ' rooms'"></span><details><summary>Edit room</summary><form class="form-grid admin-edit" th:action="@{/admin/rooms/{id}/edit(id=${r.id})}" method="post"><label>Room type<input name="type" th:value="${r.type}" required></label><label>Price per night<input type="number" name="pricePerNight" min="1" step="0.01" th:value="${r.pricePerNight}" required></label><label>Capacity<input type="number" name="capacity" min="1" th:value="${r.capacity}" required></label><label>Room inventory<input type="number" name="quantity" min="1" th:value="${r.quantity}" required></label><label class="wide">Description<input name="description" th:value="${r.description}" required></label><button class="small-button">Save room</button></form></details><form th:action="@{/admin/rooms/{id}/delete(id=${r.id})}" method="post" class="inline"><button class="text-button danger">Remove</button></form></div>
<form class="form-grid room-add" th:action="@{/admin/hotels/{id}/rooms(id=${h.id})}" method="post"><label>New room type<input name="type" required></label><label>Price / night<input type="number" name="pricePerNight" min="1" step="0.01" required></label><label>Capacity<input type="number" name="capacity" min="1" value="2" required></label><label>Quantity<input type="number" name="quantity" min="1" value="1" required></label><label class="wide">Description<input name="description" required></label><button class="small-button">Add room type</button></form>
</article></main></body></html>
