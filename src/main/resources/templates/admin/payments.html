<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">REVENUE OPERATIONS</p><h1>Payments</h1><p>Test-mode records are clearly labelled. No card details are collected and no real payment is processed.</p><h2>Recorded demo payments</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Guest</th><th>Booking</th><th>Provider</th><th>Test reference</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.createdAt}"></td><td th:text="${p.booking.guestName}"></td><td th:text="${p.booking.reference}"></td><td th:text="${p.provider}"></td><td th:text="${p.transactionReference}"></td><td th:text="'₹' + ${p.amount}"></td><td th:text="${p.status}"></td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="7">No demo payments have been recorded.</td></tr></tbody></table></div></main></body></html>
