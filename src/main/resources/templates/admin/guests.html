<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guests | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">GUEST RELATIONSHIPS</p><h1>Guests</h1><form class="filter-bar"><input name="q" placeholder="Search guest name or email" th:value="${q}"><button class="small-button">Search</button></form><div class="table-wrap"><table><thead><tr><th>Guest ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th><th>Profile</th></tr></thead><tbody><tr th:each="g:${guests}"><td th:text="${g.id}"></td><td th:text="${g.name}"></td><td th:text="${g.email}"></td><td th:text="${g.phone}"></td><td th:text="${g.createdAt}"></td><td><a th:href="@{/admin/guests/{id}(id=${g.id})}">View profile</a></td></tr></tbody></table></div></main></body></html>
