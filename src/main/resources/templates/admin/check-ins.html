<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-ins | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">FRONT DESK</p><h1>Today's check-ins</h1><form class="filter-bar" action="/admin/check-ins" method="get"><label>Arrival date<input type="date" name="date" th:value="${selectedDate}"></label><button class="small-button">Show arrivals</button><a href="/admin/check-ins">Today</a></form><p th:text="${selectedDate}"></p><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="table-wrap"><table><thead><tr><th>Guest</th><th>Room</th><th>Reference</th><th>Scheduled arrival</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="b:${bookings}"><td th:text="${b.guestName}"></td><td th:text="${b.roomUnit.roomNumber}"></td><td th:text="${b.reference}"></td><td th:text="${b.checkIn} + ' ' + ${b.checkInTime}"></td><td th:text="${b.status}"></td><td><form th:action="@{/admin/bookings/{id}/check-in(id=${b.id})}" method="post"><button class="small-button" th:disabled="${!isToday}">Check In</button></form></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6">No eligible confirmed arrivals for this date.</td></tr></tbody></table></div></main></body></html>
