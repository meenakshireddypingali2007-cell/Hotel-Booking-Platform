<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings | StayHaven Admin</title><link rel="stylesheet" href="/css/site.css"></head>
<body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><div class="admin-topbar"><div th:replace="~{fragments/nav}"></div></div>
<main class="section page"><a class="back" href="/admin">← Admin overview</a><p class="eyebrow">RESERVATIONS</p><h1>All <em>bookings.</em></h1>
<form class="filter-bar" method="get" action="/admin/bookings"><input name="q" placeholder="Reference or hotel" th:value="${q}"><input name="guest" placeholder="Guest name or email" th:value="${guest}"><input name="room" placeholder="Room number or type" th:value="${room}"><input type="date" name="date" th:value="${date}"><select name="status"><option value="" th:selected="${statusFilter == null || statusFilter == ''}">All statuses</option><option value="PENDING" th:selected="${statusFilter == 'PENDING'}">Pending</option><option value="CONFIRMED" th:selected="${statusFilter == 'CONFIRMED'}">Confirmed</option><option value="CHECKED IN" th:selected="${statusFilter == 'CHECKED IN'}">Checked In</option><option value="CHECKED OUT" th:selected="${statusFilter == 'CHECKED OUT'}">Checked Out</option><option value="CANCELLED" th:selected="${statusFilter == 'CANCELLED'}">Cancelled</option></select><button class="small-button">Filter</button><a href="/admin/bookings">Clear</a></form>
<div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Guest / email</th><th>Hotel & room</th><th>Dates</th><th>Total</th><th>Status</th><th>Update</th></tr></thead><tbody>
<tr th:each="b : ${bookings}"><td><a th:href="@{/admin/bookings/{id}(id=${b.id})}" th:text="${b.reference}"></a></td><td><b th:text="${b.guestName}"></b><br><small th:text="${b.guestEmail}"></small></td><td th:text="${b.room.hotel.name} + ' · ' + ${b.room.type}"></td><td th:text="${b.checkIn} + ' – ' + ${b.checkOut}"></td><td th:text="'₹' + ${b.totalPrice}"></td><td th:text="${b.status}"></td><td><form th:if="${b.status == 'CONFIRMED' || b.status == 'PENDING'}" th:action="@{/admin/bookings/{id}/status(id=${b.id})}" method="post" class="inline"><select name="status"><option value="CONFIRMED" th:selected="${b.status == 'CONFIRMED'}">Confirmed</option><option value="CANCELLED">Cancelled</option></select><button class="small-button">Save</button></form><span th:if="${b.status != 'CONFIRMED' && b.status != 'PENDING'}">—</span></td></tr>
<tr th:if="${#lists.isEmpty(bookings)}"><td colspan="7">No bookings match these filters.</td></tr></tbody></table></div>
</main></body></html>
