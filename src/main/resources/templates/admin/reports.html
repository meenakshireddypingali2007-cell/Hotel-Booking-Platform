<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">PROPERTY PERFORMANCE</p><h1>Reports</h1><section class="metric-grid"><article><small>ROOMS</small><strong th:text="${totalRooms}"></strong></article><article><small>ACTIVE BOOKINGS</small><strong th:text="${activeBookings}"></strong></article><article><small>IN-HOUSE GUESTS</small><strong th:text="${checkedInGuests}"></strong></article><article><small>RECORDED REVENUE</small><strong th:text="'₹' + ${revenue}"></strong></article><article><small>AVERAGE RATING</small><strong th:text="${#numbers.formatDecimal(averageRating,1,1)}"></strong></article><article><small>GUEST ACCOUNTS</small><strong th:text="${users}"></strong></article></section><p>Revenue totals bookings marked paid in the existing booking records and include test payment records. Treat demo values as non-settlement figures.</p></main></body></html>
