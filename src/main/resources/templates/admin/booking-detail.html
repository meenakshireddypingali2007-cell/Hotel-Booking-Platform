<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Booking detail | StayHaven Admin</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><div class="admin-topbar"><div th:replace="~{fragments/nav}"></div></div><main class="section page narrow"><a class="back" href="/admin/bookings">← All bookings</a><p class="eyebrow">RESERVATION DETAIL</p><h1 th:text="'Booking ' + ${booking.reference}">Booking reference</h1><div class="detail-panel"><div class="detail-grid"><section><span>GUEST</span><strong th:text="${booking.guestName}"></strong><small th:text="${booking.guestEmail}"></small><small th:text="'Account: ' + ${booking.account.email}"></small></section><section><span>HOTEL</span><strong th:text="${booking.room.hotel.name}"></strong><small th:text="${booking.room.hotel.location}"></small></section><section><span>ROOM TYPE</span><strong th:text="${booking.room.type}"></strong><small th:text="${booking.guests} + ' guests · capacity ' + ${booking.room.capacity}"></small></section><section><span>DATES</span><strong th:text="${booking.checkIn} + ' → ' + ${booking.checkOut}"></strong><small th:text="${booking.nights} + ' nights'"></small></section><section><span>PAYMENT</span><strong th:text="${booking.paymentStatus}"></strong><small>Demo checkout; no real payment processed</small></section><section><span>BOOKING TOTAL</span><strong th:text="'₹' + ${#numbers.formatDecimal(booking.totalPrice,1,2)}"></strong><small th:text="'₹' + ${#numbers.formatDecimal(booking.room.pricePerNight,1,2)} + ' per night'"></small></section><section><span>STATUS</span><strong class="status" th:text="${booking.status}"></strong></section></div><form class="status-form" th:action="@{/admin/bookings/{id}/status(id=${booking.id})}" method="post"><label>Update status<select name="status"><option value="CONFIRMED" th:selected="${booking.status == 'CONFIRMED'}">Confirmed</option><option value="CANCELLED" th:selected="${booking.status == 'CANCELLED'}">Cancelled</option></select></label><button class="button">Save status</button></form></div></main></body></html>
