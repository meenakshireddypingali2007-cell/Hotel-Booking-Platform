<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest profile | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><a href="/admin/guests">← Guests</a><p class="eyebrow">GUEST PROFILE</p><h1 th:text="${guest.name}"></h1><div class="metric-row"><article><small>GUEST ID</small><b th:text="${guest.id}"></b></article><article><small>EMAIL</small><b th:text="${guest.email}"></b></article><article><small>PHONE</small><b th:text="${guest.phone}"></b></article><article><small>ADDRESS</small><b th:text="${guest.address != null ? guest.address : 'Not provided'}"></b></article><article><small>REGISTERED</small><b th:text="${guest.createdAt}"></b></article><article><small>NUMBER OF STAYS</small><b th:text="${stays}"></b></article><article><small>RECORDED SPEND</small><b th:text="'₹' + ${spent}"></b></article></div><h2>Booking history</h2><form class="filter-bar" method="get"><select name="status"><option value="">All statuses</option><option>CONFIRMED</option><option>CHECKED IN</option><option>CHECKED OUT</option><option>CANCELLED</option></select><input type="date" name="from" th:value="${from}"><input type="date" name="to" th:value="${to}"><button class="small-button">Filter</button></form><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Hotel / room</th><th>Dates</th><th>Room</th><th>Status</th><th>Total</th></tr></thead><tbody><tr th:each="b:${bookings}"><td th:text="${b.reference}"></td><td th:text="${b.room.hotel.name} + ' / ' + ${b.room.type}"></td><td th:text="${b.checkIn} + ' → ' + ${b.checkOut}"></td><td th:text="${b.roomUnit != null ? b.roomUnit.roomNumber : 'Unassigned'}"></td><td th:text="${b.status}"></td><td th:text="'₹' + ${b.totalPrice}"></td></tr></tbody></table></div><h2>Reviews</h2><div class="table-wrap"><table><thead><tr><th>Hotel</th><th>Rating</th><th>Review</th><th>Date</th></tr></thead><tbody><tr th:each="r:${guestReviews}"><td th:text="${r.booking.room.hotel.name}"></td><td th:text="${r.rating}"></td><td th:text="${r.comment}"></td><td th:text="${r.createdAt}"></td></tr></tbody></table></div></main></body></html>
