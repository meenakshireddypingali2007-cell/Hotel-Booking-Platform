<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Users | StayHaven Admin</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><div class="admin-topbar"><div th:replace="~{fragments/nav}"></div></div><main class="section page"><a class="back" href="/admin">← Admin overview</a><p class="eyebrow">ACCOUNT ACCESS</p><h1>People & <em>accounts.</em></h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.phone}"></td><td th:text="${u.role}"></td><td th:text="${u.enabled?'Active':'Disabled'}"></td><td><form th:if="${u.role == 'USER'}" th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"><button class="small-button" th:text="${u.enabled?'Disable':'Enable'}"></button></form></td></tr></tbody></table></div></main></body></html>
