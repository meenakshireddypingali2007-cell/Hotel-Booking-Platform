<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loyalty | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">GUEST RETENTION</p><h1>Loyalty program</h1><section class="admin-section"><h2>Points rule</h2><p th:text="${rule}"></p><p>Point awards are recorded once when a checked-in booking is completed. Redemptions are applied transactionally at booking creation and cannot exceed the guest balance or booking value.</p></section><div class="table-wrap"><table><thead><tr><th>Date</th><th>Guest</th><th>Booking</th><th>Type</th><th>Points</th><th>Reason</th></tr></thead><tbody><tr th:each="t:${transactions}"><td th:text="${t.createdAt}"></td><td th:text="${t.guest.name}"></td><td th:text="${t.booking.reference}"></td><td th:text="${t.type}"></td><td th:text="${t.points}"></td><td th:text="${t.reason}"></td></tr></tbody></table></div></main></body></html>
