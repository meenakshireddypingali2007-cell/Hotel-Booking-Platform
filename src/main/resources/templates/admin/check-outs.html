<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Departures | StayHaven</title><link rel="stylesheet" href="/css/site.css"></head><body class="admin-body"><div th:replace="~{fragments/admin-nav}"></div><main class="admin-main"><p class="eyebrow">FRONT DESK</p><h1>Check-outs</h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="table-wrap"><table><thead><tr><th>Guest</th><th>Room</th><th>Reference</th><th>Scheduled departure</th><th>Checked in at</th><th>Action</th></tr></thead><tbody><tr th:each="b:${bookings}"><td th:text="${b.guestName}"></td><td th:text="${b.roomUnit != null ? b.roomUnit.roomNumber : 'Unassigned'}"></td><td th:text="${b.reference}"></td><td th:text="${b.checkOut} + ' ' + ${b.checkOutTime}"></td><td th:text="${b.checkedInAt}"></td><td><form th:action="@{/admin/bookings/{id}/check-out(id=${b.id})}" method="post"><button class="small-button">Check Out</button></form></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6">No guests currently due to check out.</td></tr></tbody></table></div></main></body></html>
